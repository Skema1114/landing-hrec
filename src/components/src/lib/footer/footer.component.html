<footer class="footer">
  <div class="footer-main">
    <div class="content">
      <nav class="footer-nav" aria-label="Links do rodapé">
        @for (nav of navFooterList; track nav.id) {
        <a [href]="nav.href" class="footer-link">{{ nav.detail }}</a>
        }
      </nav>

      <div class="logo-container">
        <img
          loading="lazy"
          src="assets/logo/logo-large.svg"
          alt="RecPlay logo"
          class="logo-image"
        />
        <div class="logo-wrapper">
          <img
            loading="lazy"
            src="assets/icon/social/instagram.svg"
            alt="Instagram"
            class="logo-icon"
          />
          <span class="logo-text">&#64;recplay.studio</span>
        </div>
      </div>

      <div class="cta-container">
        <p class="cta-text">Sua história merece ser vista.</p>
        <button class="cta-button" aria-label="Solicitar proposta via WhatsApp">
          <img
            loading="lazy"
            src="assets/icon/social/whatsapp.svg"
            alt="WhatsApp"
            class="cta-icon"
          />
          <span>Solicitar proposta</span>
        </button>
      </div>
    </div>
  </div>

  <div class="footer-copyright">
    <p class="copyright-text">Desenvolvido por</p>
    <div class="copyright-logo">
      <span class="logo-name">Rand</span>
      <span class="logo-number">2</span>
    </div>
  </div>
</footer>
