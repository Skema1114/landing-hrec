<section class="section-frame" aria-label="Vídeo institucional">
  <iframe
    class="section-frame__frame"
    src="https://www.youtube.com/embed/1JLUn2DFW4w?autoplay=1&loop=1&mute=1"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen
    title="Vídeo institucional RecPlay"
  ></iframe>

  @if (showOverlay) {
  <div class="section-frame__content" id="i-frame-call">
    <h1 class="section-frame__content__title">Vídeos que Vendem por Você</h1>

    <div class="section-frame__content__sub-content">
      <p class="section-frame__content__sub-content__title">
        Produção audiovisual estratégica para marcas que
        <br class="divider-br" />
        querem dominar o digital e multiplicar resultados.
      </p>
    </div>

    <button class="free-quote-button">Quero um vídeo que converte</button>
  </div>
  }
</section>
